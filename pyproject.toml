[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bes-designer"
version = "1.0.0"
description = "Herramienta de diseño automatizado para sistemas de Bombeo Electrosumergible (BES/ESP), metodología Kermit Brown Vol. 2b Cap. 4.5."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Pablo Tejerina" }]
dynamic = ["dependencies"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools]
# Layout src/: el único paquete distribuible es `bes` (dominio + capa API).
# `streamlit_app/` y `frontend/` son adaptadores de entrega, no librería, y
# quedan fuera de la distribución a propósito.
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Los catálogos de equipos son datos del paquete: `catalogs/loader.py` los
# resuelve con Path(__file__).parent, así que viajan con él.
"bes.catalogs" = ["*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
