<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img"
     aria-label="BES Designer">
  <!-- Ícono de pestaña. Se dibuja sobre fondo propio y no transparente: la
       pestaña puede ser clara u oscura, y un glifo suelto desaparece en una de
       las dos. Formas gruesas y pocas: a 16 px el detalle se pierde. -->
  <rect width="64" height="64" rx="14" fill="#0B3D5C"/>

  <!-- La sarta: el fluido sube por el tubing (flecha) y las tres bandas son
       las etapas apiladas de la bomba, que es lo que dimensiona la app. -->
  <g fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round">
    <path d="M32 50 V 20"/>
    <path d="M23 27 L 32 17 L 41 27" stroke-linejoin="round"/>
  </g>
  <g fill="#7FD1E8">
    <rect x="20" y="36" width="24" height="4" rx="2"/>
    <rect x="20" y="43" width="24" height="4" rx="2"/>
    <rect x="20" y="50" width="24" height="4" rx="2"/>
  </g>
</svg>
