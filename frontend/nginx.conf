# SPA + reverse proxy hacia el backend FastAPI.
# El front pide rutas relativas /api/* (client.ts: BASE=""), nginx las reenvía
# al servicio `api` de docker-compose. Para el browser todo es el mismo origen.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy de la API al backend (nombre de servicio en la red de compose).
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
    }

    # SPA fallback: cualquier ruta no-archivo devuelve index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
